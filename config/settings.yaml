# Global settings for the AI Business OS.

# Part 29 — cost classes map to model tiers. Model ids are configuration, so
# adding/replacing a model is a one-line change here (see docs/EXTENDING.md).
models:
  LOW_COST:    {model: claude-haiku-4-5, effort: null, max_tokens: 4000}
  MEDIUM_COST: {model: claude-sonnet-5,  effort: medium, max_tokens: 8000}
  HIGH_COST:   {model: claude-opus-5,    effort: high,   max_tokens: 16000}

# Relative cost units per invocation (for budgeting when real token usage is unknown)
# and USD per million tokens (input, output) for when it is known.
cost_units: {LOW_COST: 1, MEDIUM_COST: 5, HIGH_COST: 20, RULE: 0}
pricing_per_mtok:
  claude-haiku-4-5: [1.00, 5.00]
  claude-sonnet-5: [2.00, 10.00]
  claude-opus-5: [5.00, 25.00]

# Server-side refusal fallback for Opus-5-class models (opt-out by setting false).
server_side_fallbacks: true

budget:
  max_cost_units_per_run: 400
  max_llm_calls_per_run: 30

# Part 25 — team-size bounds for MODEL-BACKED agents by complexity. Deterministic
# rule checks are cheap and capped separately.
team_size:
  simple:  {min: 1, max: 3}
  medium:  {min: 3, max: 8}
  complex: {min: 8, max: 20}
max_rule_checks_per_run: 30

cache:
  enabled: true
  ttl_hours: 72          # reusable research is cached for this long

verification:
  recency_window_days: 120
  min_sources_for_fact: 1
  min_independent_publishers_for_high_confidence: 2

# Part 42 — categories that ALWAYS require human approval.
approval_required:
  - financial_transaction
  - paid_advertising
  - publish_content
  - publish_sensitive_content
  - major_product_launch
  - external_contract
  - delete_important_data
  - production_change
  - high_risk_communication
  - send_external_message

default_platforms: [linkedin, x_thread, newsletter]
