# Part 4 — Research agent family (30 specialists sharing one template).
family: research
domain: research
level: 2
defaults:
  name: "{name}"
  purpose: "Discover, verify, summarize and classify developments in {focus}; identify implications and opportunities; store evidence. Never fabricate sources."
  inputs: [objective, sources]
  outputs: [claims, findings]
  tools: [source_store, web_search, http_fetch]
  dependencies: []
  required_context: [objective, sources]
  allowed_actions: [read_sources, propose_claims, write_research_notes]
  restricted_actions: [publish, send_external_message, spend_money, fabricate_sources]
  confidence_requirements: {min_confidence: 0.6, min_sources_per_claim: 1, primary_source_preferred: true}
  quality_checks: [verification.citation, verification.primary_source]
  escalation_rules:
    - "If no captured source supports a finding, report it as an UNCERTAINTY, not a claim."
    - "If sources contradict each other, hand off to verification.contradiction."
    - "If web_search is NOT CONNECTED, ask the operator to capture sources."
  cost_class: HIGH_COST
  priority: 5
  status: ACTIVE
  executor: llm
  prompt_template: research
  capabilities: [research, discover, summarize, classify, implications, opportunities, store_evidence]
agents:
  - {id: ai_news, name: AI News Researcher, focus: "AI industry news and launches", keywords: [news, launch, launched, release, released, announcement, recent, development], priority: 8}
  - {id: ai_model, name: AI Model Researcher, focus: "foundation models, model releases, benchmarks and capabilities", keywords: [model, llm, benchmark, release, frontier, weights, reasoning], priority: 7}
  - {id: ai_agent, name: AI Agent Researcher, focus: "AI agents, agent frameworks and agentic workflows", keywords: [agent, agentic, autonomous, orchestration, multi-agent, framework], priority: 7}
  - {id: ai_coding, name: AI Coding Researcher, focus: "AI-assisted software development", keywords: [coding, code, copilot, developer, programming, ide]}
  - {id: devtools, name: Developer Tools Researcher, focus: "developer tools and platforms", keywords: [developer, tools, cli, sdk, ide, devtools]}
  - {id: api, name: API Researcher, focus: "APIs, API products and API economics", keywords: [api, endpoint, rest, graphql, pricing]}
  - {id: mcp, name: MCP Researcher, focus: "the Model Context Protocol ecosystem, servers and clients", keywords: [mcp, model context protocol, connector, server, tool]}
  - {id: automation, name: Automation Researcher, focus: "workflow automation and RPA", keywords: [automation, workflow, zapier, n8n, rpa, integration]}
  - {id: saas, name: SaaS Researcher, focus: "SaaS markets, SaaS products and SaaS business models", keywords: [saas, subscription, software, b2b]}
  - {id: startup, name: Startup Researcher, focus: "startups, funding and new companies", keywords: [startup, funding, seed, series, venture, founder]}
  - {id: robotics, name: Robotics Researcher, focus: "robotics and embodied AI", keywords: [robot, robotics, humanoid, embodied]}
  - {id: semiconductor, name: Semiconductor Researcher, focus: "chips, accelerators and compute supply", keywords: [chip, gpu, semiconductor, tpu, compute, nvidia]}
  - {id: cloud, name: Cloud Researcher, focus: "cloud platforms and infrastructure", keywords: [cloud, aws, azure, gcp, infrastructure, datacenter]}
  - {id: cybersecurity, name: Cybersecurity Researcher, focus: "cybersecurity threats, tools and AI security", keywords: [security, cybersecurity, vulnerability, attack, threat]}
  - {id: open_source, name: Open-Source Researcher, focus: "open-source projects, licenses and communities", keywords: [open source, open-source, github, license, open weights]}
  - {id: database, name: Database Researcher, focus: "databases, vector stores and data infrastructure", keywords: [database, vector, sql, postgres, data]}
  - {id: dev_ecosystem, name: Developer Ecosystem Researcher, focus: "developer ecosystems, communities and adoption", keywords: [ecosystem, developer, community, adoption]}
  - {id: enterprise_ai, name: Enterprise AI Researcher, focus: "enterprise AI adoption, procurement and governance", keywords: [enterprise, adoption, governance, b2b, compliance]}
  - {id: consumer_ai, name: Consumer AI Researcher, focus: "consumer AI products and behaviour", keywords: [consumer, app, assistant, chatbot, mobile]}
  - {id: creator_tech, name: Creator Technology Researcher, focus: "technology for creators", keywords: [creator, creators, video, youtube, audio]}
  - {id: martech, name: Marketing Technology Researcher, focus: "marketing technology", keywords: [marketing, martech, seo, ads, crm]}
  - {id: ecommerce_tech, name: Ecommerce Technology Researcher, focus: "ecommerce technology", keywords: [ecommerce, shop, retail, checkout]}
