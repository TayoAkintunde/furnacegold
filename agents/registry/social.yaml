# Part 8 — Platform content agents. One template; platform rules come from
# config/platforms.yaml via params.platform, so each agent writes natively for its platform.
family: social
domain: content
level: 3
defaults:
  purpose: "Write platform-native {focus} drafts from verified knowledge and approved content angles. Follows the platform's format, length and norms; never copies text between platforms verbatim."
  inputs: [content_angles, knowledge, claims]
  outputs: [content]
  tools: [platform_rules]
  dependencies: []
  required_context: [content_angles, claims]
  allowed_actions: [write_draft]
  restricted_actions: [publish, send_external_message, fabricate_claims, fabricate_metrics]
  confidence_requirements: {min_confidence: 0.6, claims_must_be_verified: true}
  quality_checks: [content_quality.factuality, content_quality.hallucination, content_quality.hype, content_quality.platform_fit]
  escalation_rules:
    - "Drafts always go to the human approval queue; publishing requires approval and a connected integration."
  cost_class: MEDIUM_COST
  priority: 5
  status: ACTIVE
  executor: llm
  prompt_template: platform_content
  capabilities: [platform_content]
agents:
  # keywords = platform names only; params.group ties format variants to their platform;
  # params.format_keywords = the format that must be named for a variant to be chosen.
  - {id: x_post, name: X Short-Post Agent, focus: "X (Twitter) short post", params: {platform: x_post, group: x}, keywords: [x, twitter, tweet]}
  - {id: x_thread, name: X Thread Agent, focus: "X (Twitter) thread", params: {platform: x_thread, group: x, format_keywords: [thread]}, keywords: [x, twitter]}
  - {id: linkedin, name: LinkedIn Agent, focus: "LinkedIn post", params: {platform: linkedin, group: linkedin}, keywords: [linkedin], priority: 7}
  - {id: linkedin_carousel, name: LinkedIn Carousel Agent, focus: "LinkedIn document carousel", params: {platform: linkedin_carousel, group: linkedin, format_keywords: [carousel]}, keywords: [linkedin]}
  - {id: instagram, name: Instagram Agent, focus: "Instagram caption", params: {platform: instagram, group: instagram}, keywords: [instagram]}
  - {id: instagram_carousel, name: Instagram Carousel Agent, focus: "Instagram carousel", params: {platform: instagram_carousel, group: instagram, format_keywords: [carousel]}, keywords: [instagram]}
  - {id: tiktok, name: TikTok Agent, focus: "TikTok video script", params: {platform: tiktok, group: tiktok}, keywords: [tiktok]}
  - {id: youtube_shorts, name: YouTube Shorts Agent, focus: "YouTube Shorts script", params: {platform: youtube_shorts, group: youtube}, keywords: [youtube]}
  - {id: facebook, name: Facebook Agent, focus: "Facebook post", params: {platform: facebook, group: facebook}, keywords: [facebook]}
  - {id: reddit, name: Reddit Educational-Content Agent, focus: "Reddit educational post (value-first, no self-promotion, follows subreddit rules)", params: {platform: reddit, group: reddit}, keywords: [reddit, subreddit]}
  - {id: community, name: Community-Content Agent, focus: "community post (Discord/Slack/forum)", params: {platform: community, group: community}, keywords: [discord, forum, slack community]}
  - {id: newsletter, name: Newsletter Agent, focus: "email newsletter issue", params: {platform: newsletter, group: newsletter}, keywords: [newsletter], priority: 7}
  - {id: blog, name: Blog Agent, focus: "blog article", params: {platform: blog, group: blog}, keywords: [blog, article], priority: 7}
  - {id: seo, name: SEO Content Agent, focus: "search-optimized article", params: {platform: seo_article, group: seo}, keywords: [seo]}
  - {id: podcast, name: Podcast Agent, focus: "podcast episode outline", params: {platform: podcast, group: podcast}, keywords: [podcast]}
